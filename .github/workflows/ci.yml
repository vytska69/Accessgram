name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Build & Test ──────────────────────────────────────────────────────────────
jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/tdlib
          key: homebrew-tdlib-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: homebrew-tdlib-${{ runner.os }}-

      - name: Install TDLib
        run: brew install tdlib

      - name: Export pkg-config path
        run: echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Cache Swift PM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build -c debug 2>&1 | tee build-debug.log
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Build (release)
        run: swift build -c release 2>&1 | tee build-release.log
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Run tests
        run: swift test --parallel 2>&1 | tee test.log
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          retention-days: 7

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftLint binary
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar/swiftlint
          key: swiftlint-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  # ── Release ─────────────────────────────────────────────────────────────────
  release:
    name: Package DMG & Publish Release
    runs-on: macos-14
    needs: [build-and-test]
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/tdlib
          key: homebrew-tdlib-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: homebrew-tdlib-${{ runner.os }}-

      - name: Install TDLib
        run: brew install tdlib

      - name: Export pkg-config path
        run: echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Cache Swift PM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Assemble .app bundle
        run: bash Scripts/bundle.sh .build/release/Accessgram ${{ github.run_number }}

      - name: Create DMG
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          bash Scripts/make-dmg.sh "$SHORT_SHA"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "DMG_NAME=Accessgram-${SHORT_SHA}.dmg" >> "$GITHUB_ENV"

      - name: Verify DMG exists
        run: |
          echo "DMG_NAME=${DMG_NAME}"
          ls -lh "${DMG_NAME}"

      - name: Publish rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u "+%Y-%m-%d %H:%M UTC")
          BRANCH="${GITHUB_REF_NAME}"
          TDLIB_VER=$(brew list --versions tdlib | awk '{print $2}')
          NOTES=/tmp/release-notes.md

          {
            echo "## Accessgram Dev Build"
            echo ""
            echo "**Branch:** \`${BRANCH}\`"
            echo "**Commit:** [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "**Build:** #${{ github.run_number }}"
            echo ""
            echo "### Installation"
            echo "1. Download \`${DMG_NAME}\` below"
            echo "2. Open the DMG and drag **Accessgram** to **Applications**"
            echo "3. First launch: right-click -> **Open** (bypasses Gatekeeper)"
            echo "4. Add your API credentials from [my.telegram.org](https://my.telegram.org)"
            echo ""
            echo "### What's included"
            echo "- Accessgram binary (macOS 14+, Apple Silicon)"
            echo "- TDLib ${TDLIB_VER} embedded -- no separate install needed"
            echo ""
            echo "> Ad-hoc signed only. Notarisation requires an Apple Developer account."
          } > "${NOTES}"

          # Delete release + its tag together; safe to fail on first ever run
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest "${DMG_NAME}" \
            --title "Dev Build - ${DATE}" \
            --prerelease \
            --notes-file "${NOTES}"
