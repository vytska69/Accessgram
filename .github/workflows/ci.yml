name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Shared TDLib cache step (reused by every job) ─────────────────────────────
# Jobs restore the cache using the same key produced by tdlib-cache.yml.

jobs:
  # ── Build & Test ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get TDLib master SHA
        id: tdlib-sha
        run: |
          SHA=$(git ls-remote https://github.com/tdlib/td.git HEAD | awk '{print $1}' | cut -c1-10)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "TDLib master HEAD: $SHA"

      - name: Restore TDLib cache
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: /opt/tdlib
          key: tdlib-master-${{ runner.os }}-arm64-${{ steps.tdlib-sha.outputs.sha }}

      - name: Fail fast if TDLib cache missing
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          echo "::error::TDLib cache not found. The tdlib-cache workflow must complete first."
          echo "::error::Trigger it manually via Actions → TDLib Cache → Run workflow."
          exit 1

      - name: Export TDLib paths
        run: |
          echo "PKG_CONFIG_PATH=/opt/tdlib/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "TDLIB_PREFIX=/opt/tdlib" >> "$GITHUB_ENV"

      - name: Cache Swift PM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build -c debug 2>&1 | tee build-debug.log
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Build (release)
        run: swift build -c release 2>&1 | tee build-release.log
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Run tests
        run: swift test --parallel 2>&1 | tee test.log
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          retention-days: 7

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftLint binary
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar/swiftlint
          key: swiftlint-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install SwiftLint
        run: brew install swiftlint && brew link --overwrite swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  # ── Release ──────────────────────────────────────────────────────────────────
  release:
    name: Package DMG & Publish Release
    runs-on: macos-14
    needs: [build-and-test]
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get TDLib master SHA
        id: tdlib-sha
        run: |
          SHA=$(git ls-remote https://github.com/tdlib/td.git HEAD | awk '{print $1}' | cut -c1-10)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Restore TDLib cache
        uses: actions/cache@v4
        with:
          path: /opt/tdlib
          key: tdlib-master-${{ runner.os }}-arm64-${{ steps.tdlib-sha.outputs.sha }}

      - name: Export TDLib paths
        run: |
          echo "PKG_CONFIG_PATH=/opt/tdlib/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "TDLIB_PREFIX=/opt/tdlib" >> "$GITHUB_ENV"

      - name: Cache Swift PM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm /tmp/cert.p12
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Found identity: $IDENTITY"

      - name: Assemble .app bundle
        run: bash Scripts/bundle.sh .build/release/Accessgram ${{ github.run_number }}
        env:
          TDLIB_PREFIX: /opt/tdlib

      - name: Create DMG
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          bash Scripts/make-dmg.sh "$SHORT_SHA"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "DMG_NAME=Accessgram-${SHORT_SHA}.dmg" >> "$GITHUB_ENV"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "${DMG_NAME}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${DMG_NAME}"

      - name: Verify DMG exists
        run: |
          echo "DMG_NAME=${DMG_NAME}"
          ls -lh "${DMG_NAME}"

      - name: Publish rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u "+%Y-%m-%d %H:%M UTC")
          BRANCH="${GITHUB_REF_NAME}"
          TDLIB_SHA="${{ steps.tdlib-sha.outputs.sha }}"
          NOTES=/tmp/release-notes.md

          {
            echo "## Accessgram Dev Build"
            echo ""
            echo "**Branch:** \`${BRANCH}\`"
            echo "**Commit:** [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "**Build:** #${{ github.run_number }}"
            echo "**TDLib:** master @ \`${TDLIB_SHA}\`"
            echo ""
            echo "### Installation"
            echo "1. Download \`${DMG_NAME}\` below"
            echo "2. Open the DMG and drag **Accessgram** to **Applications**"
            echo ""
            echo "### What's included"
            echo "- Accessgram binary (macOS 14+, Apple Silicon)"
            echo "- TDLib master embedded -- no separate install needed"
            echo "- Signed and notarized by Apple"
          } > "${NOTES}"

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest "${DMG_NAME}" \
            --title "Dev Build - ${DATE}" \
            --prerelease \
            --notes-file "${NOTES}"
