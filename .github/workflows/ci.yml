name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build & Test ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get TDLib master SHA
        id: tdlib-sha
        run: |
          SHA=$(git ls-remote https://github.com/tdlib/td.git HEAD | awk '{print $1}' | cut -c1-10)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "TDLib master HEAD: $SHA"

      - name: Cache TDLib build
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: /opt/tdlib
          key: tdlib-master-${{ runner.os }}-arm64-${{ steps.tdlib-sha.outputs.sha }}

      - name: Install TDLib build dependencies
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: brew install cmake gperf openssl

      - name: Build TDLib from master
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/tdlib/td /tmp/td
          cmake -B /tmp/td-build -S /tmp/td \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/tdlib \
            -DTD_ENABLE_JNI=OFF \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)
          cmake --build /tmp/td-build -j$(sysctl -n hw.ncpu)
          sudo cmake --install /tmp/td-build

      - name: Export TDLib paths
        run: |
          echo "PKG_CONFIG_PATH=/opt/tdlib/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "TDLIB_PREFIX=/opt/tdlib" >> "$GITHUB_ENV"

      - name: Cache Swift PM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build -c debug 2>&1 | tee build-debug.log
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Build (release)
        run: swift build -c release 2>&1 | tee build-release.log
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Run tests
        run: swift test --parallel 2>&1 | tee test.log
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          retention-days: 7

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftLint binary
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar/swiftlint
          key: swiftlint-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install SwiftLint
        run: brew install swiftlint && brew link --overwrite swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  # ── Release ──────────────────────────────────────────────────────────────────
  release:
    name: Package DMG & Publish Release
    runs-on: macos-14
    needs: [build-and-test]
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version
        id: version
        run: |
          CURRENT=$(cat VERSION)
          NEW=$(python3 -c "v=float('$CURRENT'); print(f'{v+0.1:.1f}')")
          echo "$NEW" > VERSION
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping $CURRENT → $NEW"

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Get TDLib master SHA
        id: tdlib-sha
        run: |
          SHA=$(git ls-remote https://github.com/tdlib/td.git HEAD | awk '{print $1}' | cut -c1-10)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Cache TDLib build
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: /opt/tdlib
          key: tdlib-master-${{ runner.os }}-arm64-${{ steps.tdlib-sha.outputs.sha }}

      - name: Install TDLib build dependencies
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: brew install cmake gperf openssl

      - name: Build TDLib from master
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/tdlib/td /tmp/td
          cmake -B /tmp/td-build -S /tmp/td \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/tdlib \
            -DTD_ENABLE_JNI=OFF \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)
          cmake --build /tmp/td-build -j$(sysctl -n hw.ncpu)
          sudo cmake --install /tmp/td-build

      - name: Export TDLib paths
        run: |
          echo "PKG_CONFIG_PATH=/opt/tdlib/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "TDLIB_PREFIX=/opt/tdlib" >> "$GITHUB_ENV"

      - name: Cache Swift PM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Assemble .app bundle
        run: bash Scripts/bundle.sh .build/release/Accessgram ${{ github.run_number }} ${{ steps.version.outputs.version }}
        env:
          TDLIB_PREFIX: /opt/tdlib

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATETIME=$(date -u "+%Y-%m-%d-%H-%M")
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          DMG_BASE="Accessgram-${VERSION}-${DATETIME}"
          bash Scripts/make-dmg.sh "$DMG_BASE"
          echo "DMG_NAME=${DMG_BASE}.dmg" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify DMG exists
        run: |
          echo "DMG_NAME=${DMG_NAME}"
          ls -lh "${DMG_NAME}"

      - name: Publish rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u "+%Y-%m-%d %H:%M UTC")
          BRANCH="${GITHUB_REF_NAME}"
          TDLIB_SHA="${{ steps.tdlib-sha.outputs.sha }}"
          NOTES=/tmp/release-notes.md

          {
            echo "## Accessgram ${VERSION}"
            echo ""
            echo "**Branch:** \`${BRANCH}\`"
            echo "**Commit:** [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "**Build:** #${{ github.run_number }}"
            echo "**TDLib:** master @ \`${TDLIB_SHA}\`"
            echo ""
            echo "### Installation"
            echo "1. Download \`${DMG_NAME}\` below"
            echo "2. Open the DMG and drag **Accessgram** to **Applications**"
            echo "3. First launch: right-click → **Open** (bypasses Gatekeeper)"
            echo ""
            echo "### What's included"
            echo "- Accessgram binary (macOS 14+, Apple Silicon)"
            echo "- TDLib master embedded -- no separate install needed"
            echo ""
            echo "> Ad-hoc signed only."
          } > "${NOTES}"

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest "${DMG_NAME}" \
            --title "Accessgram ${VERSION} — ${DATE}" \
            --prerelease \
            --notes-file "${NOTES}"
