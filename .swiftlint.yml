included:
  - Sources
  - Tests

excluded:
  - .build

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - multiline_arguments
  - operator_usage_whitespace
  - prefer_self_in_static_references
  - sorted_imports
  - toggle_bool
  - yoda_condition

disabled_rules:
  - todo                # TODOs are expected during development
  - trailing_whitespace # handled by editor

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 400
  error: 700

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length: 1          # allow single-letter loop vars
  excluded:
    - id
    - vm
    - ok

cyclomatic_complexity:
  warning: 15
  error: 25
